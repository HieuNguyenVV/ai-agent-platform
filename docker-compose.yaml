services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-api
    ports:
      - 8080:8080
    networks:
      - ai-agent-network
    restart: always
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ai-agent
      - POSTGRES_PASSWORD=ai-agent
      - POSTGRES_DB=ai-agent-db
    env_file:
      - .env
 
  postgres:
    image: postgres:16-alpine
    container_name: postgres-ai-agent
    environment:
      POSTGRES_USER: ai-agent
      POSTGRES_PASSWORD: ai-agent
      POSTGRES_DB: ai-agent-db
    ports:
      - 5492:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ai-agent-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrator:
    build:
      context: .
      dockerfile: migrate.dockerfile
    container_name: migrator-book-hive
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:6
    environment:
      # Inside Docker network Postgres listens on 5432.
      DATABASE_URL: postgres://ai-agent:ai-agent@postgres:5432/ai-agent-db?sslmode=disable
    networks:
      - ai-agent-network

  redis:
    image: redis:7-alpine
    container_name: redis-ai-agent
    ports:
      - "6375:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ai-agent-network
    
volumes:
  postgres_data:

networks:
  ai-agent-network:
    driver: bridge